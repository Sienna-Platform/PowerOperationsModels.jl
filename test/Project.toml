# InfraStore is not registered yet, so it cannot resolve from a registry. Pkg
# only honors the [sources] section of the root project, so this environment
# needs its own entry (and InfraStore must be a direct dependency for the source
# to apply). Drop the dep + entry once InfraStore is registered.
[sources]
PowerOperationsModels = {path = ".."}
# LOCAL PATH CO-DEV PIN (temporary): POM's IS4 git pin resolved to an older commit
# than PSY's local checkout expects (TimeSeriesKey UnionAll mismatch on load).
# Revert to the git rev pin once PSY's local changes land on IS4.
InfrastructureSystems = {rev = "IS4", url = "https://github.com/Sienna-Platform/InfrastructureSystems.jl"}
InfrastructureOptimizationModels = {rev = "main", url = "https://github.com/Sienna-Platform/InfrastructureOptimizationModels.jl"}
# LOCAL PATH CO-DEV PIN (temporary): the variable -> variable_operation_cost cost-field
# rename on PSY's generated cost types is uncommitted on disk, not on the psy6 branch yet.
# Revert to the git rev pin once pushed/merged.
PowerSystems = {rev = "psy6", url = "https://github.com/Sienna-Platform/PowerSystems.jl"}
# LOCAL PATH CO-DEV PIN (temporary): PSB's to_file call was updated for PSY's
# unit_system -> power_units rename on local disk only. Revert with the pins above.
PowerSystemCaseBuilder = {rev = "psy6", url = "https://github.com/Sienna-Platform/PowerSystemCaseBuilder.jl"}
# LOCAL PATH CO-DEV PINS (temporary): the local PowerSystems checkout pinned above reads
